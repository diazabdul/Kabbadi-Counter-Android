# Copy this file to local.properties and adjust values for your machine.
# Do NOT commit local.properties.

# Android SDK location (example only, adjust to your environment)
# sdk.dir=C:\\Users\\<YOUR_USER>\\AppData\\Local\\Android\\Sdk

# Backend base URL used by Retrofit (must end with "/")
# Emulator (Laravel running on host machine)
BACKEND_BASE_URL=https://android.bersamahotspot.com/api/

# Physical device on same Wi-Fi as backend machine (example):
# BACKEND_BASE_URL=http://192.168.1.10:8002/api/

# Production (example):
# BACKEND_BASE_URL=https://your-production-domain.com/api/
